services:
  budgetbot-api:
    build: .
    command: ["python", "main.py", "api"]
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://budgetbot:budgetbot_password@postgres:5432/budgetbot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Telegram bot worker — start with: make docker-telegram
  budgetbot-telegram:
    build: .
    profiles: ["telegram"]
    command: ["python", "main.py", "telegram"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://budgetbot:budgetbot_password@postgres:5432/budgetbot
      REDIS_URL: redis://redis:6379/0
      ENABLE_VOICE_PROCESSING: "True"
      STT_PROVIDER: auto
      STT_MODEL: base
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - whisper_cache:/root/.cache
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: budgetbot
      POSTGRES_USER: budgetbot
      POSTGRES_PASSWORD: budgetbot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetbot -d budgetbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles: ["tools"]

volumes:
  postgres_data:
  whisper_cache:
