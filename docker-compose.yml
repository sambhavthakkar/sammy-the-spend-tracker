services:
  budgetbot:
    build: .
    command: ["python", "main.py", "telegram"]
    env_file:
      - .env
    environment:
      PERSONAL_DATA_DIR: /app/personal_data
    volumes:
      - personal_data:/app/personal_data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - whisper_cache:/root/.cache
    restart: unless-stopped

volumes:
  personal_data:
  whisper_cache:
